<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none">
  <!-- House base -->
  <rect x="15" y="50" width="90" height="25" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <!-- Low slope roof -->
  <polygon points="10,50 60,38 110,50" fill="#9CA3AF" stroke="#374151" stroke-width="2"/>
  <!-- Roof ridge line -->
  <line x1="10" y1="50" x2="110" y2="50" stroke="#374151" stroke-width="1"/>
  <!-- Label -->
  <text x="60" y="72" text-anchor="middle" font-size="8" fill="#6B7280" font-family="sans-serif">3-4/12</text>
</svg>
