<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <!-- House base - 3D view -->
  <polygon points="20,70 20,45 80,35 80,60" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <polygon points="20,70 80,60 110,70 50,80" fill="#D1D5DB" stroke="#374151" stroke-width="2"/>
  <polygon points="80,35 110,45 110,70 80,60" fill="#9CA3AF" stroke="#374151" stroke-width="2"/>
  <!-- Hip roof - 4 sides -->
  <polygon points="20,45 40,25 70,22 50,35" fill="#6B7280" stroke="#374151" stroke-width="2"/>
  <polygon points="40,25 70,22 95,28 65,22" fill="#4B5563" stroke="#374151" stroke-width="2"/>
  <polygon points="70,22 95,28 110,45 80,35" fill="#9CA3AF" stroke="#374151" stroke-width="2"/>
  <polygon points="50,35 80,35 95,28 40,25" fill="#6B7280" stroke="#374151" stroke-width="1.5"/>
  <!-- Ridge line -->
  <line x1="40" y1="25" x2="95" y2="28" stroke="#374151" stroke-width="2"/>
  <!-- Label -->
  <text x="60" y="95" text-anchor="middle" font-size="9" fill="#6B7280" font-family="sans-serif">Hip (4-Sided)</text>
</svg>
