<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none">
  <!-- House base -->
  <rect x="15" y="45" width="90" height="30" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <!-- Flat roof line -->
  <line x1="10" y1="45" x2="110" y2="45" stroke="#374151" stroke-width="3"/>
  <!-- Roof surface indication -->
  <rect x="15" y="38" width="90" height="7" fill="#9CA3AF"/>
  <!-- Label -->
  <text x="60" y="72" text-anchor="middle" font-size="8" fill="#6B7280" font-family="sans-serif">0-2/12</text>
</svg>
