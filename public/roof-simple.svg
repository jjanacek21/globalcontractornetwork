<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <!-- 3D Building base -->
  <polygon points="20,70 20,40 80,30 80,60" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <polygon points="20,70 80,60 110,70 50,80" fill="#D1D5DB" stroke="#374151" stroke-width="2"/>
  <polygon points="80,30 110,40 110,70 80,60" fill="#9CA3AF" stroke="#374151" stroke-width="2"/>
  <!-- Flat roof surface -->
  <polygon points="20,40 80,30 110,40 50,50" fill="#6B7280" stroke="#374151" stroke-width="2"/>
  <!-- Label -->
  <text x="60" y="95" text-anchor="middle" font-size="9" fill="#6B7280" font-family="sans-serif">Simple / Flat</text>
</svg>
