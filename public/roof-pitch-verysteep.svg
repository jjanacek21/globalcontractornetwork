<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none">
  <!-- House base -->
  <rect x="25" y="58" width="70" height="17" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <!-- Very steep slope roof -->
  <polygon points="20,58 60,10 100,58" fill="#9CA3AF" stroke="#374151" stroke-width="2"/>
  <!-- Ridge line highlight -->
  <line x1="60" y1="10" x2="60" y2="15" stroke="#374151" stroke-width="2"/>
  <!-- Label -->
  <text x="60" y="72" text-anchor="middle" font-size="8" fill="#6B7280" font-family="sans-serif">9-12/12</text>
</svg>
