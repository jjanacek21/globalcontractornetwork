<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <!-- House base - 3D view -->
  <polygon points="20,70 20,45 80,35 80,60" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <polygon points="20,70 80,60 110,70 50,80" fill="#D1D5DB" stroke="#374151" stroke-width="2"/>
  <polygon points="80,35 110,45 110,70 80,60" fill="#9CA3AF" stroke="#374151" stroke-width="2"/>
  <!-- Gable roof - 2 sides -->
  <polygon points="20,45 50,20 80,35 50,35" fill="#6B7280" stroke="#374151" stroke-width="2"/>
  <polygon points="50,20 80,35 110,45 80,25" fill="#9CA3AF" stroke="#374151" stroke-width="2"/>
  <!-- Ridge line -->
  <line x1="50" y1="20" x2="80" y2="25" stroke="#374151" stroke-width="2"/>
  <!-- Label -->
  <text x="60" y="95" text-anchor="middle" font-size="9" fill="#6B7280" font-family="sans-serif">Gable (2-Sided)</text>
</svg>
